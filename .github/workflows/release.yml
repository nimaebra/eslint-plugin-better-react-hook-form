name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version already prepared on main (requires npm setup)
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit && pnpm check && pnpm test:coverage && pnpm audit --prod --audit-level=low
      - name: Verify packaged consumers
        run: |
          for eslint in 9.0.0 '^9' 10.0.0 '^10'; do
            for rhf in 7.55.0 '^7'; do
              pnpm smoke:pack --eslint-version "$eslint" --rhf-version "$rhf"
            done
          done
          pnpm smoke:pack --typescript-version 5.3.3 --rhf-version none
          pnpm smoke:pack --typescript-version '^6' --rhf-version none
      - name: Create version PR or explicitly publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && 'pnpm release:publish' || '' }}
          commit-message: "chore(release): release packages"
          pr-title: "chore(release): release packages"
          create-github-releases: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          push-git-tags: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          NPM_CONFIG_PROVENANCE: true
